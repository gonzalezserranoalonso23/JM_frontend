<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111111" />
    <title>Desconectada | JM Panel</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #111;
        color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: max(1.5rem, env(safe-area-inset-top, 0px)) 24px
          max(1.5rem, env(safe-area-inset-bottom, 0px));
        text-align: center;
        box-sizing: border-box;
      }
      .notice {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        font-size: 1.875rem;
        margin: 0;
      }
      p {
        margin: 0;
        color: #fff;
        line-height: 1.5;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      footer {
        margin-top: auto;
        padding-bottom: max(2rem, env(safe-area-inset-bottom, 0px));
      }
    </style>
  </head>
  <body>
    <main role="alert">
      <div class="notice">
        <img src="/icon-192.png" alt="" />
        <h1>Desconectada</h1>
      </div>
      <footer>
        <p>support@site.com</p>
      </footer>
    </main>
    <script>
      window.addEventListener('online', () => location.reload())
    </script>
  </body>
</html>
