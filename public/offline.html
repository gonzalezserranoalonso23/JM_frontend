<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111111" />
    <title>Sin conexión | JM Panel</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #111;
        color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        box-sizing: border-box;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0;
      }
      p {
        margin: 0;
        max-width: 28rem;
        color: #cbd5e1;
        line-height: 1.5;
      }
      button {
        min-height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 8px;
        background: #d90429;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main role="alert">
      <img src="/icon-192.png" alt="" />
      <h1>Sin conexión a internet</h1>
      <p>
        No se pudo cargar la aplicación. Revisa tu conexión; cuando regrese,
        reintenta.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
    <script>
      window.addEventListener('online', () => location.reload())
    </script>
  </body>
</html>
